# The vmdata mount has nofail, so the host boots without it. Without this line,
# libvirt would then write VM disks to the root file system.
[Unit]
RequiresMountsFor=/var/lib/libvirt

# The vmdata partition is empty on the first boot, and it hides any directory
# from the image build. A tmpfiles rule does not work: the mount has nofail, so
# it is not ordered before local-fs.target, and tmpfiles runs before the mount.
# The README copies the base image of the guest here before the first
# "quarry-guest create".
[Service]
ExecStartPre=/usr/bin/install -d -m 0755 /var/lib/libvirt/images
