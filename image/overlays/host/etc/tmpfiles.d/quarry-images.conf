# The vmdata partition is empty on the first boot, and it hides any directory
# that the image build makes in /var/lib/libvirt. A tmpfiles rule runs after the
# mount, so the directory is on the partition. The base image of the guest goes
# here before the first "quarry-guest create" (see the README).
d /var/lib/libvirt/images 0755 root root -
