# systemd-repart adds this partition in the free space of the boot disk.
# /etc/fstab activates the partition by its label. On later boots,
# systemd-gpt-auto-generator would find it by its type, but it runs before
# systemd-repart, so it cannot find the partition on the first boot.
[Partition]
Type=swap
Label=swap
SizeMinBytes=4G
SizeMaxBytes=4G
