# The global NTP pool. The pool directive resolves to several servers.
pool pool.ntp.org iburst

driftfile /var/lib/chrony/chrony.drift

# This host can have a bad clock, for example after a long power-off.
# Step the clock when the offset is more than 1 second, but only during the
# first 3 updates. Later updates only slew the clock.
makestep 1 3

# Copy the system time to the hardware clock about every 11 minutes.
rtcsync
