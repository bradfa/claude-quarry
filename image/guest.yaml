# debos recipe for the claude-quarry guest: Debian 13 (trixie), UEFI, systemd-boot.
#
# Build with image/build.sh. The script sets and checks the variables.
# The image is the read-only base image of the guest (see
# doc/design/guest-storage.md). It holds the ESP and a fixed-size root. The
# workspace, the Claude Code configuration, and the SSH host keys live on a
# second disk with the file system label "data" (see overlays/guest and
# doc/design/claude-code.md).
#
# Commands that print nothing on success use -v or an echo line, so the build
# log shows every change.

{{- $admin_user := or .admin_user "" }}
{{- $claude_user := or .claude_user "claude" }}
{{- $admin_ssh_key := or .admin_ssh_key "" }}
{{- $sudo_mode := or .sudo_mode "agent" }}
{{- $guest_name := or .guest_name "quarry-guest" }}
{{- $guest_image_size := or .guest_image_size "32GB" }}
{{- $guest_extra_packages := or .guest_extra_packages "" }}
{{- $mirror := or .mirror "http://deb.debian.org/debian/" }}
{{- $claude_code_channel := or .claude_code_channel "stable" }}
{{- $kernel_cmdline_extra := or .kernel_cmdline_extra "" }}

architecture: amd64

actions:
  - action: run
    description: Stop early if a required variable is missing
    chroot: false
    command: |
      [ -n '{{ $admin_user }}' ] || { echo "admin_user is not set" >&2; exit 1; }
      [ -n '{{ $admin_ssh_key }}' ] || { echo "admin_ssh_key is not set" >&2; exit 1; }
      [ '{{ $admin_user }}' != root ] || { echo "admin_user must not be root" >&2; exit 1; }
      [ '{{ $claude_user }}' != root ] || { echo "claude_user must not be root" >&2; exit 1; }
      [ '{{ $claude_user }}' != '{{ $admin_user }}' ] || { echo "claude_user and admin_user must differ" >&2; exit 1; }
      case '{{ $sudo_mode }}' in agent|nopasswd) ;; *) echo "sudo_mode must be agent or nopasswd" >&2; exit 1 ;; esac
      case '{{ $claude_code_channel }}' in stable|latest) ;; *) echo "claude_code_channel must be stable or latest" >&2; exit 1 ;; esac

  - action: debootstrap
    description: Debootstrap core distro
    suite: trixie
    components:
      - main
      - contrib
      - non-free
      - non-free-firmware
    mirror: {{ $mirror }}

  - action: run
    description: Use the main, updates, and security repositories
    chroot: true
    command: |
      set -e
      rm -fv /etc/apt/sources.list
      echo "Writing /etc/apt/sources.list.d/debian.sources"
      cat > /etc/apt/sources.list.d/debian.sources <<'EOF'
      Types: deb
      URIs: {{ $mirror }}
      Suites: trixie trixie-updates
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

      Types: deb
      URIs: http://deb.debian.org/debian-security/
      Suites: trixie-security
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      EOF
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get -y dist-upgrade

  - action: apt
    description: Install base packages
    packages:
      - ca-certificates
      - chrony
      - curl
      - dosfstools
      - git
      - gpg
      - iproute2
      - less
      - linux-image-amd64
      - locales
      - openssh-server
      - qemu-guest-agent
      # For the virtual machines that a test or runqemu starts in the guest
      # (see doc/design/guest-access.md, the kvm group).
      - qemu-system-x86
      - sudo
      - systemd-resolved
      - tmux
      - unattended-upgrades
      - zstd

  # The packages that the Yocto Project manual lists for a Debian build
  # machine, apart from those above. Bitbake needs them, and the account of
  # Claude cannot install packages.
  - action: apt
    description: Install the Yocto build packages
    packages:
      - build-essential
      - chrpath
      - cpio
      - debianutils
      - diffstat
      - file
      - gawk
      - gcc
      - iputils-ping
      - libacl1
      - lz4
      - python3
      - python3-git
      - python3-jinja2
      - python3-pexpect
      - python3-pip
      - python3-subunit
      - socat
      - texinfo
      - unzip
      - wget
      - xz-utils

{{ if $guest_extra_packages }}
  # Set with GUEST_EXTRA_PACKAGES, for the needs of one project. An overlay
  # reset removes a package that an administrator installs by hand, so a
  # package that every session needs belongs here.
  - action: run
    description: Install the extra packages
    chroot: true
    command: DEBIAN_FRONTEND=noninteractive apt-get -y install {{ $guest_extra_packages }}
{{ end }}

  - action: overlay
    description: Apply system overlay files
    source: overlays/guest

  - action: run
    description: Set host name, locale, and time zone
    chroot: true
    command: |
      set -e
      echo "Setting host name to {{ $guest_name }}"
      echo '{{ $guest_name }}' > /etc/hostname
      echo "Generating the en_US.UTF-8 locale"
      echo 'en_US.UTF-8 UTF-8' > /etc/locale.gen
      locale-gen
      echo 'LANG=en_US.UTF-8' > /etc/default/locale
      ln -sfv /usr/share/zoneinfo/UTC /etc/localtime
      echo UTC > /etc/timezone

  # Both accounts use the same key. Root owns the key files, so the Claude
  # account cannot add a key to its own account (see
  # doc/design/guest-access.md). The Claude account is in the kvm group only:
  # no sudo, no disk. The group gives /dev/kvm, so that a test or a Yocto
  # runqemu run in the guest uses hardware acceleration.
  - action: run
    description: Create the Claude and administrator users and lock root
    chroot: true
    command: |
      set -e
      echo "Creating user {{ $claude_user }}"
      useradd --create-home --shell /bin/bash --groups kvm '{{ $claude_user }}'
      echo "Creating user {{ $admin_user }}"
      useradd --create-home --shell /bin/bash --groups sudo '{{ $admin_user }}'
      chmod -v 0700 '/home/{{ $claude_user }}' '/home/{{ $admin_user }}'
      install -v -d -m 0755 -o root -g root /etc/ssh/authorized_keys
      for user in '{{ $claude_user }}' '{{ $admin_user }}'; do
        echo "Writing /etc/ssh/authorized_keys/$user"
        printf '%s\n' '{{ $admin_ssh_key }}' > "/etc/ssh/authorized_keys/$user"
        chown -v root:root "/etc/ssh/authorized_keys/$user"
        chmod -v 0644 "/etc/ssh/authorized_keys/$user"
      done
      passwd -l root

  # The file names the two accounts, so the recipe writes it. The host keys
  # are on the data disk, so the host sees the same key after each reset of
  # the overlay. Without the data disk, sshd does not start.
  - action: run
    description: Configure sshd for the two accounts
    chroot: true
    command: |
      set -e
      echo "Writing /etc/ssh/sshd_config.d/10-quarry.conf"
      cat > /etc/ssh/sshd_config.d/10-quarry.conf <<'EOF'
      # Key login only. The first value of a keyword wins, and the main file
      # reads this directory first.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers {{ $claude_user }} {{ $admin_user }}
      AuthorizedKeysFile /etc/ssh/authorized_keys/%u
      HostKey /data/etc/ssh/ssh_host_ed25519_key

      # This guards against a mistake in the client configuration. It does not
      # stop a user who has a shell (see sshd_config(5)).
      Match User {{ $claude_user }}
          AllowAgentForwarding no
      EOF

{{ if eq $sudo_mode "agent" }}
  - action: apt
    description: Install the PAM module for sudo with an SSH agent
    packages:
      - libpam-ssh-agent-auth

  - action: run
    description: Gate sudo on the SSH agent of the administrator
    chroot: true
    command: |
      set -e
      echo "Writing /etc/security/sudo_authorized_keys"
      printf '%s\n' '{{ $admin_ssh_key }}' > /etc/security/sudo_authorized_keys
      chmod -v 0644 /etc/security/sudo_authorized_keys
      echo "Adding the pam_ssh_agent_auth line to /etc/pam.d/sudo"
      sed -i '1a auth sufficient pam_ssh_agent_auth.so file=/etc/security/sudo_authorized_keys' /etc/pam.d/sudo
      echo "Writing /etc/sudoers.d/10-quarry-agent"
      echo 'Defaults env_keep += "SSH_AUTH_SOCK"' > /etc/sudoers.d/10-quarry-agent
      chmod -v 0440 /etc/sudoers.d/10-quarry-agent
      visudo -cf /etc/sudoers.d/10-quarry-agent
{{ else }}
  - action: run
    description: Let the sudo group use sudo without a password
    chroot: true
    command: |
      set -e
      echo "Writing /etc/sudoers.d/10-quarry-nopasswd"
      echo '%sudo ALL=(ALL:ALL) NOPASSWD: ALL' > /etc/sudoers.d/10-quarry-nopasswd
      chmod -v 0440 /etc/sudoers.d/10-quarry-nopasswd
      visudo -cf /etc/sudoers.d/10-quarry-nopasswd
{{ end }}

  # The unit makes the files on the data disk that sshd and Claude Code need.
  # It names the Claude account, so the recipe writes it. It does nothing, and
  # sshd then fails to start, when the data disk is not mounted. A guest
  # without its data disk must not make new host keys on the overlay, and
  # Claude Code must not keep its login on the overlay.
  - action: run
    description: Prepare the data disk at each boot
    chroot: true
    command: |
      set -e
      echo "Writing /etc/systemd/system/quarry-data-setup.service"
      cat > /etc/systemd/system/quarry-data-setup.service <<'EOF'
      [Unit]
      Description=Prepare the data disk for sshd and Claude Code
      RequiresMountsFor=/data
      ConditionPathIsMountPoint=/data
      Before=ssh.service ssh.socket

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      # ssh-keygen -A makes only the missing keys. It needs the directory.
      ExecStart=/usr/bin/install -d -m 0755 /data/etc/ssh
      ExecStart=/usr/bin/ssh-keygen -A -f /data
      ExecStart=/usr/bin/test -e /data/etc/ssh/ssh_host_ed25519_key
      ExecStart=/usr/bin/install -d -m 0700 -o {{ $claude_user }} -g {{ $claude_user }} /data/claude-config

      [Install]
      WantedBy=multi-user.target
      EOF

  - action: run
    description: Enable services
    chroot: true
    command: |
      set -e
      systemctl enable systemd-networkd.service systemd-resolved.service chrony.service ssh.service quarry-data-setup.service
      systemctl mask systemd-firstboot.service

  - action: run
    description: Create the mount points
    chroot: true
    command: mkdir -pv /data /boot/efi

  # The ESP is large because Debian keeps a copy of each kernel and initrd in
  # /boot on the root file system and another copy in the ESP.
  #
  # The partition type GUIDs come from the Discoverable Partitions
  # Specification. Start and end values use sectors (512 bytes). Every start
  # is a multiple of 2048 sectors (1 MiB). The end value is the last sector of
  # the partition.
  - action: image-partition
    description: Create a partitioned disk image
    imagename: guest.img
    imagesize: {{ $guest_image_size }}
    partitiontype: gpt
    partitions:
      - name: ESP
        parlabel: ESP
        flags: [ boot, esp ]
        parttype: c12a7328-f81f-11d2-ba4b-00a0c93ec93b # EFI System Partition
        fs: vfat
        start: 2048s
        end: 2099199s # 1 GiB
        fsck: true
      - name: root
        parttype: 4f68bce3-e8cd-4db1-96e7-fbcaf984b709 # Root partition, x86-64
        fs: ext4
        start: 2099200s
        end: 100%
        fsck: true
    mountpoints:
      # The ESP holds the random seed of systemd-boot. A FAT file system has no
      # file modes, so the mount options decide who can read the seed. debos
      # puts these options in /etc/fstab only. The mount during the build
      # ignores them, so bootctl warns about the seed in the build log.
      - mountpoint: /boot/efi/
        partition: ESP
        options: [ umask=0077 ]
      - mountpoint: /
        partition: root

  - action: filesystem-deploy
    description: Deploy the created filesystem onto the disk image
    setup-fstab: true
    setup-kernel-cmdline: true
{{- if $kernel_cmdline_extra }}
    # Set with KERNEL_CMDLINE_EXTRA, for example a serial console for a test in
    # a virtual machine. The last console= option is the system console.
    append-kernel-cmdline: {{ $kernel_cmdline_extra }}
{{- end }}

  # With nofail, a missing data disk does not stop the boot, so the console
  # stays usable. The data disk has the file system label "data".
  - action: run
    description: Mount the data disk by label
    chroot: true
    command: |
      echo "Adding the data disk to /etc/fstab"
      echo 'LABEL=data /data ext4 defaults,nofail,x-systemd.device-timeout=30s 0 2' >> /etc/fstab
      cat /etc/fstab

  # Same chain as the host image (see image/host.yaml): Debian signs
  # systemd-boot and the kernel, and the shim does nothing when Secure Boot is
  # off. Do not add efibootmgr, because a build on the build machine could then
  # reach its NVRAM.
  - action: apt
    description: Install systemd-boot bootloader and the Secure Boot shim
    packages:
      - shim-signed
      - systemd-boot
      - systemd-boot-efi-amd64-signed

  - action: run
    description: Fix up the systemd-boot default timeout
    chroot: false
    command: |
      echo "Enabling the timeout in loader.conf"
      sed -i -e "s/#timeout/timeout/g" $ROOTDIR/boot/efi/loader/loader.conf

  # Some kernel-install versions add systemd.machine_id= to the entries. That
  # option forces the build-time ID on every guest made from this image.
  - action: run
    description: Remove the build-time machine ID from the boot entries
    chroot: false
    command: |
      echo "Removing systemd.machine_id from the boot entries"
      sed -i -E 's/ ?systemd\.machine_id=[0-9a-f]+//' $ROOTDIR/boot/efi/loader/entries/*.conf

  - action: run
    description: Remove the build-time machine ID, SSH host keys, and random seed
    chroot: true
    command: |
      set -e
      echo "Emptying /etc/machine-id"
      truncate -s 0 /etc/machine-id
      rm -fv /var/lib/dbus/machine-id /etc/ssh/ssh_host_*key* /boot/efi/loader/random-seed

  # The package comes from the signed apt repository of Anthropic, so root owns
  # the binary and Claude cannot change it (see doc/design/claude-code.md). The
  # build stops if the key is not the one that Anthropic publishes. The channel
  # sets the repository URL, the suite, and the origin line for
  # unattended-upgrades. The pin file in the overlay limits the repository to
  # one package.
  - action: run
    description: Install Claude Code from the Anthropic apt repository
    chroot: true
    command: |
      set -e
      install -v -d -m 0755 /etc/apt/keyrings
      echo "Downloading the signing key"
      curl -fsSL https://downloads.claude.ai/keys/claude-code.asc -o /etc/apt/keyrings/claude-code.asc
      keys=$(GNUPGHOME=$(mktemp -d) gpg --show-keys --with-colons /etc/apt/keyrings/claude-code.asc)
      [ "$(printf '%s\n' "$keys" | grep -c '^pub:')" = 1 ] || { echo "the key file must hold exactly one key" >&2; exit 1; }
      printf '%s\n' "$keys" | grep -q '^fpr:::::::::31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE:$' ||
        { echo "the key has the wrong fingerprint" >&2; exit 1; }
      echo "Writing /etc/apt/sources.list.d/claude-code.list"
      echo 'deb [signed-by=/etc/apt/keyrings/claude-code.asc] https://downloads.claude.ai/claude-code/apt/{{ $claude_code_channel }} {{ $claude_code_channel }} main' > /etc/apt/sources.list.d/claude-code.list
      echo "Writing /etc/apt/apt.conf.d/52quarry-claude-code"
      echo 'Unattended-Upgrade::Origins-Pattern:: "origin=Anthropic,codename={{ $claude_code_channel }},label=Anthropic";' > /etc/apt/apt.conf.d/52quarry-claude-code
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get -y install claude-code
      dpkg -L claude-code
      claude --version

  # The base system installs ifupdown. systemd-networkd manages the network
  # in this guest, and two network managers must not run together. This step
  # comes after all package installs, so no later install brings it back.
  - action: run
    description: Remove ifupdown
    chroot: true
    command: DEBIAN_FRONTEND=noninteractive apt-get -y purge ifupdown

  - action: run
    description: Clean up the apt downloaded files
    chroot: true
    command: apt-get clean
